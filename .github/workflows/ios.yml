name: Factory iOS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'design/Factory.icon/**'
      - 'web/lib/router.js'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

concurrency:
  group: factory-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test native Back on iPhone Duo
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: python3 ios/test-rail.py

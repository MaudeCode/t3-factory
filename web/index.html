<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151516" media="(prefers-color-scheme: dark)" />
    <title>T3 Factory</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Factory" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main id="login" class="login" hidden>
      <div class="login-card">
        <img src="/icon.svg" width="40" height="40" alt="" />
        <h1>T3 Factory</h1>
        <p id="login-description">Pair this device with your Mac to control the factory.</p>
        <button id="sso-login" class="btn btn-primary" hidden>Sign in with SSO</button>
        <form id="pair-form" hidden>
          <label class="field">
            <span>Pairing code or link</span>
            <input id="pair-code" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          </label>
          <button class="btn btn-primary" type="submit">Connect</button>
        </form>
        <p id="pair-help" class="hint" hidden>
          Run <code>t3-factory web-pair</code> on your Mac. Links expire after 10 minutes.
        </p>
        <p id="login-error" class="alert alert-error" role="alert" hidden></p>
      </div>
    </main>

    <div id="app" class="shell" hidden>
      <aside class="sidebar">
        <a class="brand" href="#overview" data-page="overview">
          <img src="/icon.svg" alt="" width="24" height="24" />
          <span>T3 Factory</span>
        </a>
        <nav aria-label="Pages">
          <a href="#overview" data-page="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Overview</span></a>
          <a href="#runs" data-page="runs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Runs</span></a>
          <a href="#models" data-page="models"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v2M15 3v2M9 19v2M15 19v2M3 9h2M3 15h2M19 9h2M19 15h2M7 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM9 9h6v6H9z"/></svg><span>Models</span></a>
          <a href="#automation" data-page="automation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/></svg><span>Automation</span></a>
          <a href="#projects" data-page="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></a>
          <a href="#discovery" data-page="discovery"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg><span>Discovery</span></a>
          <a href="#upstream" data-page="upstream"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v12M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM18 9a9 9 0 0 1-9 9"/></svg><span>Upstream</span></a>
        </nav>
        <div class="sidebar-foot">
          <span id="connection" class="conn" role="status">Connecting</span>
          <button class="btn btn-ghost btn-sm" data-action="logout">Disconnect</button>
        </div>
      </aside>

      <main class="content">
        <div id="ptr" class="ptr" aria-live="polite"></div>
        <header class="page-head">
          <h1 id="page-title">Overview</h1>
        </header>
        <div id="error" class="alert alert-error" role="alert" hidden></div>
        <div id="notice" class="alert alert-ok" role="status" hidden></div>
        <div id="page"></div>
      </main>

      <div id="save-bar" class="save-bar" hidden>
        <span>You have unsaved changes</span>
        <button class="btn btn-ghost btn-sm" data-action="revert">Discard</button>
        <button class="btn btn-primary btn-sm" data-action="save">Save</button>
      </div>
    </div>

    <dialog id="model-dialog">
      <form method="dialog" class="dialog-head">
        <h2>Model</h2>
        <button class="btn btn-ghost btn-sm" aria-label="Close model editor">Done</button>
      </form>
      <div id="model-editor"></div>
    </dialog>
    <dialog id="readiness-dialog" aria-labelledby="readiness-title" aria-describedby="readiness-description">
      <h2 id="readiness-title">Run without the readiness label?</h2>
      <p id="readiness-description"></p>
      <form method="dialog" class="actions">
        <button class="btn btn-ghost" autofocus>Cancel</button>
        <button type="button" class="btn btn-primary" data-action="run-without-ready-label">Run anyway</button>
      </form>
    </dialog>
  </body>
</html>
